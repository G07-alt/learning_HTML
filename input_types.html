<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>ALL Input Types Type in HTML</h2>
    <form>
        <label>First Name</label>
        <input type="text" placeholder="Enter Your Name"/>
        <br><br>
        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name"/>
        <br><br>
        <label>Enter Email</label>
        <input type="email" placeholder="Enter Email"/>
        <br><br>
        <label>Enter Fax Number</label>
        <input type="Number" placeholder="Enter fax Number"/>
        <br><br>
        <label>Select DOB</label>
        <input type="date"/>
        <label>Select Month</label>
        <input type="month"/>
        <label>Select week</label>
        <input type="week"/>
        <br><br>
        <label>Select Time</label>
        <input type="time"/>
        <label>Date and Time</label>
        <input type="datetime-local"/>
        <br><br>
        <label>Choose City</label>
        <input type="checkbox" checked> Mumbai
        <input type="checkbox" > Pune
        <input type="checkbox" > Nashik
        <input type="checkbox" > Latur
        <br><br>
        <label>select Gender</label>
        <input type="radio" name ="gender"/> Male
        <input type="radio" name ="gender"/> female
        <input type="radio" name ="gender"/> other
        <br><br>
        <label>Select color</label>
        <input type="color"/>
         
        <label>Select Range</label>
        <input type="range"/>

        <label>Uplod Docs</label>
        <input type="file" multiple/>

        <label>Enter Passward</label>
        <input type="password" placeholder="Enter Passward"/>

        <label>Search</label>
        <input type="search" placeholder="Enter to search"/>
        <br><br>
        <label>Enter url</label>
        <input type="url" placeholder="https://example.com"/>

        <label>Enter Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number"/>
        <br><br>
        <label>Select Country</label>
        <select>
            <option >Choose</option>
            <option >India</option>
            <option >US</option>
            <option >UK</option>
            <option >Shrilanka</option>
        </select>
        <br><br>
        <label>Enter Address</label>
        <textarea rows="5" cols="30"></textarea>
        <br><br>
        <input type="submit" value="submit"/>
        <input type="button" value="submit"/>
        <input type="reset" value="reset"/>
        <br><br>
        


















        









         


    </form>
</body>
</html>
